[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gripsync-analysis-engine"
version = "0.1.0"
description = "GripSync Python Analysis Engine"
requires-python = ">=3.11"
dependencies = [
    "mediapipe",
    "opencv-python",
    "numpy",
    "pytesseract",
    "pillow",
    "pydantic",
    "scikit-learn",
    "mss"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio"
]
